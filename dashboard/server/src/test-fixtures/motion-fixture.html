<!doctype html><meta charset=utf-8><title>motion fixture</title>
<style>
  body{margin:0;font:16px system-ui;background:#faf7f2}
  section{height:100vh;padding:40px}
  /* 1. hero entrance: CSS animation, 800ms */
  .hero h1{animation:rise 800ms cubic-bezier(.16,1,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
  /* 2. scroll reveal: transition flipped by IntersectionObserver, 500ms, 120ms stagger */
  .card{opacity:0;transform:translateY(24px);transition:opacity 500ms ease,transform 500ms ease}
  .card.in{opacity:1;transform:translateY(0)}
  /* 3. ambient loop: infinite */
  .blob{width:80px;height:80px;border-radius:99px;background:#c8b6ff;animation:float 3000ms ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-24px)}}
  /* 4. hover: 250ms */
  .btn{display:inline-block;padding:10px 18px;border:1px solid #333;transition:transform 250ms ease,background 250ms ease}
  .btn:hover{transform:translateY(-4px);background:#ffd6a5}
  /* 5. scroll-linked parallax, driven by rAF like GSAP would */
  .para{width:200px;height:200px;background:#a0c4ff}
</style>
<section class="hero"><h1>Hero heading</h1><div class="blob"></div><a class="btn" href="#">hover me</a></section>
<section><div class="card">one</div><div class="card">two</div><div class="card">three</div></section>
<section><div class="para"></div></section>
<script>
  // reveal with a 120ms stagger between siblings
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){
    const i=[...document.querySelectorAll('.card')].indexOf(e.target);
    setTimeout(()=>e.target.classList.add('in'),i*120); io.unobserve(e.target);}}),{threshold:.2});
  document.querySelectorAll('.card').forEach(c=>io.observe(c));
  // parallax: transform is a pure function of scrollY, written from rAF —
  // invisible to getAnimations(), exactly like GSAP/ScrollTrigger.
  const para=document.querySelector('.para');
  const tick=()=>{para.style.transform='translateY('+(window.scrollY*0.25).toFixed(1)+'px)';requestAnimationFrame(tick)};
  requestAnimationFrame(tick);
</script>
