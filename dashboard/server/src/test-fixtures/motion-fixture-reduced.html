<!doctype html><meta charset=utf-8><title>motion fixture — honours prefers-reduced-motion</title>
<!--
  THE SIBLING OF motion-fixture.html THAT ACTUALLY READS THE PREFERENCE.

  motion-fixture.html carries no `prefers-reduced-motion` block, deliberately and
  as a recorded measurement (see SUPPRESS_MOTION_SOURCE in motion-capture.ts).
  Against that page playwright's `reducedMotion` context option changes nothing,
  so no test using it can tell a capture that sets the option correctly from one
  that hardcodes "reduce". This page can: at no-preference its h1 runs the same
  800ms entrance, and at reduce it does not move at all.

  IT IS DELIBERATELY THE SMALLEST PAGE THAT ANSWERS THAT QUESTION, and every
  omission below is load-bearing, because `probeReducedMotion` calls the page
  honouring only when its harvest is EMPTY:

    no rAF parallax       the first inline write flips the computed transform
                          from "none" to "matrix(...)", which the sampler counts
                          as a change even though the value never moves again.
    no IntersectionObserver reveal, no infinite blob, no hover target
                          each is a change under reduce or a phase this page does
                          not need; the four fixtures' declared numbers live in
                          motion-fixture.html and are asserted there.
    nothing scrollable    scrollRange is 0, so the six-step ramp costs nothing.
-->
<style>
  body{margin:0;font:16px system-ui;background:#faf7f2}
  .hero{padding:40px}
  /* The same 800ms hero entrance motion-fixture.html declares, so a capture of
     this page at no-preference produces a load-entrance with a number a human
     wrote. */
  .hero h1{animation:rise 800ms cubic-bezier(.16,1,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
  /* AND UNLIKE motion-fixture.html, THIS PAGE HONOURS THE PREFERENCE. This is
     the whole reason the file exists. `animation:none` leaves the h1 at its
     settled opacity and transform, so a capture under reduce harvests nothing. */
  @media (prefers-reduced-motion: reduce){
    .hero h1{animation:none}
  }
</style>
<section class="hero"><h1>Hero heading</h1></section>
